[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "line-laser-calibration-tool"
version = "0.1.0"
description = "Unified orchestration and provenance layer for the line-laser calibration scripts"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "numpy>=1.24", "opencv-python>=4.8", "PySide6>=6.5", "scipy>=1.10"]

[project.optional-dependencies]
analysis = ["matplotlib>=3.8", "pandas>=2.0"]
test = ["pytest>=8.0", "matplotlib>=3.8", "pandas>=2.0"]

[project.scripts]
line-laser-calibration = "calibration_tool.cli:main"
line-laser-calibration-gui = "calibration_tool.gui.app:main"

[tool.setuptools.packages.find]
include = ["calibration_tool*"]
