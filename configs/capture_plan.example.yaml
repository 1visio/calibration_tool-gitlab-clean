schema_version: 1
dataset_id: calibration_capture_demo
output_dir: ../data/calibration_capture_demo
backend: synthetic
serial_number: SIM-001

metadata:
  purpose: acquisition_smoke
  note: 使用 synthetic 后端验证采集目录、命名和质量检查链路。

camera:
  exposure_us: 1200.0
  gain_db: 0.0
  pixel_format: Mono8
  offset_x: 0
  offset_y: 0
  width: 2448
  height: 2048
  timeout_ms: 2000

quality:
  max_saturation_fraction: 0.05
  max_dark_fraction: 0.95
  min_dynamic_range_u8: 20.0
  min_laser_coverage: 0.30
  require_chessboard_detection: true
  max_chessboard_saturation_fraction: 0.005
  max_chessboard_highlight_fraction: 0.20
  max_chessboard_p995_u8: 245.0
  max_laser_saturation_fraction: 0.001
  max_laser_peak_saturation_fraction: 0.02
  max_laser_peak_near_saturation_fraction: 0.10
  max_laser_saturated_width_px: 1.0

board:
  pattern_cols: 11
  pattern_rows: 8

backend_options:
  target_fps: 30.0
  seed: 20260803

tasks:
  - task_id: laser_pose_01_800us
    pose_id: pose_01
    role: laser_plane
    instruction: 固定棋盘姿态并打开线激光。
    frames: 2
    settle_frames: 5
    image_format: png
    quality_mode: laser
    filename_template: laser_plane/{exposure_folder}/{pose_id}{index_suffix}{suffix}
    camera:
      exposure_us: 800.0

  - task_id: laser_pose_01_1200us
    pose_id: pose_01
    role: laser_plane
    instruction: 保持棋盘姿态不变，仅调整曝光。
    frames: 2
    settle_frames: 5
    image_format: png
    quality_mode: laser
    filename_template: laser_plane/{exposure_folder}/{pose_id}{index_suffix}{suffix}
    camera:
      exposure_us: 1200.0

