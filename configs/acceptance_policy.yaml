schema_version: 1

# 哪些输入是正式验收的必需项。历史诊断报告可在自己的 policy 中关闭部分要求，
# 但正式发布建议全部保持 true。
required:
  workflow_completed: true
  quality_report: true
  runtime_profile_clean: true
  golden_match: true
  compensation: true
  artifacts: true

compensation:
  # 必须另外满足：evaluation > 0 且 build + evaluation == loaded。
  max_profile_after_pv_mm: 0.25
  max_profile_after_rms_mm: 0.05
  min_pv_reduction_fraction: 0.80
  min_rms_reduction_fraction: 0.80
  max_repeatability_sigma_mm: 0.02

